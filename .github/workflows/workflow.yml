name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-26.04-arm
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Login to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build and push
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.REGISTRY_URL }}/websocket-dc:${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          build-args: ${{ secrets.ENV_FILE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ${{ secrets.REGISTRY_URL }}/websocket-dc@${{ steps.docker-build.outputs.digest }}
        run: cosign sign --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false --new-bundle-format=false --yes "$IMAGE_REF"
      - name: Verify signature
        env:
          IMAGE_REF: ${{ secrets.REGISTRY_URL }}/websocket-dc@${{ steps.docker-build.outputs.digest }}
        run: cosign verify --key cosign.pub --insecure-ignore-tlog=true "$IMAGE_REF"
      - name: Notify Image Updater
        env:
          ARGOCD_URL: ${{ secrets.ARGOCD_URL }}
          WEBHOOK_SECRET: ${{ secrets.IMAGE_UPDATER_WEBHOOK_SECRET }}
          REGISTRY: ${{ secrets.REGISTRY_URL }}
          REPOSITORY: websocket-dc
          TAG: ${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          DIGEST: ${{ steps.docker-build.outputs.digest }}
          EVENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jq -n \
            --arg id "$EVENT_ID" \
            --arg registry "$REGISTRY" \
            --arg repo "$REPOSITORY" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            '{
              specversion: "1.0",
              id: $id,
              type: "registry.image.push",
              source: ("https://" + $registry),
              subject: ($repo + ":" + $tag),
              time: (now | todate),
              datacontenttype: "application/json",
              data: {registry: $registry, repository: $repo, tag: $tag, digest: $digest}
            }' |
          curl --fail-with-body -sS --retry 3 --retry-all-errors \
            -X POST "https://${ARGOCD_URL}?type=cloudevents" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --data-binary @-
